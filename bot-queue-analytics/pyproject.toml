[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-queue-analytics"
version = "0.1.0"
description = "Low-impact, read-only queue & wait-time analytics for Bank of Taiwan branches"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.35.0",
    "pandas>=2.0.0",
]
dev = [
    "pytest>=8.0.0",
]
