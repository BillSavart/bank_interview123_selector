name: CI

# Fast checks for pull requests. Pushes to main are gated by the `checks` job in
# deploy.yml (which `build` → `deploy` depend on), so we only run here on PRs to
# avoid duplicate runs. Never pulls the Google Sheet or touches the VM — just
# typecheck, unit tests, and validation of the committed banks-data.json.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.3
          cache: npm

      - name: Install deps
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Test API and SQLite
        run: |
          npm rebuild better-sqlite3
          npm run test:parity

      - name: Validate committed banks-data.json
        run: npm run check:banks-data
